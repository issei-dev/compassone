    function createNode(tag, className, text) {
      const element = document.createElement(tag);

      if (className) {
        element.className = className;
      }

      if (text !== undefined) {
        element.textContent = text;
      }

      return element;
    }

    function photoSlot(id, caption = "", eager = false) {
      return `

    }

    function createPhoto(id, caption = "", eager = false) {
      const data = photos.get(id);
      const figure = createNode("figure", `photo ${data.kind}`);
      figure.style.setProperty("--photo-color", data.color);

      const image = document.createElement("img");
      image.src = `./assets/${id}.PNG`;
      image.alt = data.title;
      image.loading = eager ? "eager" : "lazy";
      image.decoding = "async";

      if (data.kind === "intern") {
        image.width = 800;
        image.height = 1200;
      } else if (data.kind === "employee") {
        image.width = 960;
        image.height = 1200;
      } else {
        image.width = 1800;
        image.height = 1200;
      }

      image.addEventListener("error", () => {
        figure.classList.add("image-missing");
      });

      image.addEventListener("load", () => {
        figure.classList.remove("image-missing");
      });

      figure.append(image);

      if (caption) {
        figure.append(createNode("figcaption", "photo-caption", caption));
      }

      return figure;
    }

    function hydratePhotos(root) {

            holder.dataset.photo,

            holder.dataset.eager === "true"
          )
        );
      });
    }

    let lastFocusedElement = null;

    function openDialog(dialog) {
      lastFocusedElement = document.activeElement;
      dialog.showModal();
      document.body.classList.add("modal-open");
      dialog.querySelector(".dialog-close").focus();
    }

    document.querySelectorAll("dialog").forEach((dialog) => {
      dialog.querySelector(".dialog-close").addEventListener("click", () => {
        dialog.close();
      });

      dialog.addEventListener("click", (event) => {
        const rect = dialog.getBoundingClientRect();
        const outside =
          event.clientX < rect.left ||
          event.clientX > rect.right ||
          event.clientY < rect.top ||
          event.clientY > rect.bottom;

        if (event.target === dialog && outside) {
          dialog.close();
        }
      });

      dialog.addEventListener("close", () => {
        document.body.classList.remove("modal-open");

        if (lastFocusedElement && document.contains(lastFocusedElement)) {
          lastFocusedElement.focus();
        }
      });
    });

    function bindGallery(root) {
      root.querySelectorAll("[data-enlarge]").forEach((button) => {
        button.addEventListener("click", () => {
          const photo = photos.get(button.dataset.enlarge);

          document.getElementById("lightbox-photo").replaceChildren(
            createPhoto(photo.id, "", true)
          );
          document.getElementById("lightbox-title").textContent = photo.title;
          document.getElementById("lightbox-description").textContent = photo.description || "";

          openDialog(document.getElementById("lightbox"));
        });
      });
    }

    function bindPage() {
      document.querySelectorAll("[data-person-filter]").forEach((button) => {
        button.addEventListener("click", () => {
          document.querySelectorAll("[data-person-filter]").forEach((item) => {
            item.setAttribute("aria-pressed", String(item === button));
          });

          const selected = button.dataset.personFilter === "all"
            ? employees
            : employees.filter((person) => person.category === button.dataset.personFilter);

          const grid = document.getElementById("people-grid");
          grid.innerHTML = selected.map((person) => employeeCard(person)).join("");
          hydratePhotos(grid);

          document.getElementById("person-count").textContent = `MEMBERS / ${selected.length}`;
        });
      });

      document.querySelectorAll("[data-office-filter]").forEach((button) => {
        button.addEventListener("click", () => {
          document.querySelectorAll("[data-office-filter]").forEach((item) => {
            item.setAttribute("aria-pressed", String(item === button));
          });

          const selected = button.dataset.officeFilter === "all"
            ? officePhotos
            : officePhotos.filter((photo) => photo.category === button.dataset.officeFilter);

          const grid = document.getElementById("office-grid");
          grid.innerHTML = galleryCards(selected);
          hydratePhotos(grid);
          bindGallery(grid);

          document.getElementById("office-count").textContent = `SPACES / ${selected.length}`;
        });
      });

      document.querySelectorAll("[data-scene-filter]").forEach((button) => {
        button.addEventListener("click", () => {
          document.querySelectorAll("[data-scene-filter]").forEach((item) => {
            item.setAttribute("aria-pressed", String(item === button));
          });

          const selected = button.dataset.sceneFilter === "all"
            ? scenes
            : scenes.filter((photo) => photo.category === button.dataset.sceneFilter);

          const grid = document.getElementById("scene-grid");
          grid.innerHTML = galleryCards(selected);
          hydratePhotos(grid);
          bindGallery(grid);

          document.getElementById("scene-count").textContent = `PHOTOS / ${selected.length}`;
        });
      });

      document.querySelectorAll("[data-intern]").forEach((button) => {
        button.addEventListener("click", () => {
          const person = interns.find((item) => item.id === button.dataset.intern);
          const content = document.getElementById("profile-content");

          content.innerHTML = `
            <div class="profile-layout">
              ${photoSlot(`intern-${person.id}`, "", true)}
              <div>
                <span class="eyebrow">Internship member / 2027</span>
                <h2 id="profile-title">${person.name}</h2>
                <p class="note">${person.study}／2027年卒業予定</p>
                <h3>参加のきっかけ</h3>
                <p>${person.motivation}</p>
                <h3>取り組んだこと</h3>
                <p>${person.challenge}</p>
                <h3>持ち帰った気づき</h3>
                <p>${person.learning}</p>
              </div>
            </div>
          `;

          hydratePhotos(content);
          openDialog(document.getElementById("profile-dialog"));
        });
      });

      bindGallery(document.getElementById("main"));
    }

    const menuToggle = document.querySelector(".menu-toggle");
    const navigation = document.getElementById("navigation");

    function closeMenu() {
      navigation.classList.remove("is-open");
      menuToggle.setAttribute("aria-expanded", "false");
      menuToggle.textContent = "MENU ＋";
    }

    menuToggle.addEventListener("click", () => {
      const open = navigation.classList.toggle("is-open");
      menuToggle.setAttribute("aria-expanded", String(open));
      menuToggle.textContent = open ? "CLOSE −" : "MENU ＋";
    });

    navigation.querySelectorAll("a").forEach((link) => {
      link.addEventListener("click", closeMenu);
    });

    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape" && navigation.classList.contains("is-open")) {
        closeMenu();
        menuToggle.focus();
      }
    });

    const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)");
    let revealObserver = null;

    if ("IntersectionObserver" in window && !reducedMotion.matches) {
      revealObserver = new IntersectionObserver((entries) => {
        entries.forEach((entry) => {
          if (entry.isIntersecting) {
            entry.target.classList.remove("pending");
            revealObserver.unobserve(entry.target);
          }
        });
      }, {
        threshold: 0.05
      });
    }

    function observeReveal(root) {
      if (!revealObserver) {
        return;
      }

      revealObserver.disconnect();

      root.querySelectorAll(".reveal").forEach((item) => {
        item.classList.add("pending");
        revealObserver.observe(item);
      });
    }

    const pageTitles = {
      home: "つながらない、その先へ。",
      recruit: "採用情報",
      interviews: "社員インタビュー",
      office: "オフィス紹介",
      graduate: "2027年度 新卒採用",
      internship: "インターンシップ"
    };

    const pageDescriptions = {
      home: "CompassONEは、業務システム開発とクラウド運用を基盤に、AIと既存の仕組みをつなぐIT企業です。",
      recruit: "CompassONEの採用情報。働き方、大切にしていること、各職種の役割をご紹介します。",
      interviews: "CompassONEで働く10人の社員インタビュー。仕事への向き合い方と、チームへの思いを紹介します。",
      office: "CompassONEのオフィス紹介。集中、共同作業、対話を支える空間をご覧ください。",
      graduate: "CompassONEの2027年度新卒採用。AIが進む時代に、人の判断と対話で技術と現場をつなぐ。",
      internship: "2027年卒業予定の学生によるCompassONEインターンシップ。5人の紹介と活動の様子をご覧ください。"
    };

    let currentPageRoute = "";

    function route(initial = false) {
      const requested = location.hash.slice(1) || "home";
      const [requestedPage, detail] = requested.split("/");
      const allowed = ["home", "recruit", "interviews", "interview", "office", "graduate", "internship"];
      let page = allowed.includes(requestedPage) ? requestedPage : "home";

      if (page === "interview" && !employees.some((person) => person.id === detail)) {
        page = "interviews";
      }

      const pageRoute = page === "interview" ? `interview/${detail}` : page;
      const changed = currentPageRoute !== pageRoute;

      if (changed || initial) {
        document.querySelectorAll("dialog[open]").forEach((dialog) => {
          dialog.close();
        });

        const renderers = {
          home: renderHome,
          recruit: renderRecruit,
          interviews: renderInterviews,
          office: renderOffice,
          graduate: renderGraduate,
          internship: renderInternship
        };

        const main = document.getElementById("main");
        main.innerHTML = page === "interview"
          ? renderInterview(detail)
          : renderers[page]();

        hydratePhotos(main);
        bindPage();
        observeReveal(main);
        currentPageRoute = pageRoute;
      }

      const activeNavigation = page === "interview" ? "interviews" : page;

      document.querySelectorAll("[data-nav]").forEach((link) => {
        if (link.dataset.nav === activeNavigation) {
          link.setAttribute("aria-current", "page");
        } else {
          link.removeAttribute("aria-current");
        }
      });

      const person = page === "interview"
        ? employees.find((item) => item.id === detail)
        : null;

      document.title = person
        ? `${person.name}｜社員インタビュー｜CompassONE`
        : `${pageTitles[page]}｜CompassONE`;

      document.querySelector('meta[name="description"]').content = person
        ? `${person.department} ${person.role}、${person.name}のインタビュー。${person.title}`
        : pageDescriptions[page];

      closeMenu();

      requestAnimationFrame(() => {
        const target = page !== "interview" && detail
          ? document.getElementById(detail)
          : null;

        if (target) {
          target.scrollIntoView({
            behavior: initial || reducedMotion.matches ? "auto" : "smooth",
            block: "start"
          });

          if (detail === "main") {
            target.focus({
              preventScroll: true
            });
          }
        } else if (changed || initial) {
          window.scrollTo({
            top: 0,
            behavior: "instant"
          });

          if (!initial) {
            const title = document.querySelector("#main h1");

            if (title) {
              title.setAttribute("tabindex", "-1");
              title.focus({
                preventScroll: true
              });
            }
          }
        }
      });
    }

    window.addEventListener("hashchange", () => {
      route(false);
    });

    route(true);
  </script>
